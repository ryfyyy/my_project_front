<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Каталог спецтехники SANY</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="catalog">
        <header class="catalog-header">
            <h1 class="catalog-title">
                <span>КАТАЛОГ</span>
                <span>СПЕЦТЕХНИКИ SANY</span>
            </h1>
            <p class="catalog-description">
                Основными приоритетными продуктами нашей компании являются:
                бетонная техника (автобетононасосы, автобетоносмесители),
                асфальтовые заводы, карьерные самосвалы, автогрейдеры и катки.
            </p>
        </header>

        <section class="catalog-grid" aria-label="Категории техники">
            <article class="catalog-card">
                <img src="img.png" alt="Бетонная техника SANY" class="catalog-card-image">
                <div class="catalog-card-overlay"></div>
                <h2 class="catalog-card-title">
                    Бетонная техника
                </h2>
            </article>
            <article class="catalog-card">
                <img src="img.png" alt="Бетонная техника SANY" class="catalog-card-image">
                <div class="catalog-card-overlay"></div>
                <h2 class="catalog-card-title">
                    Бетонная техника
                </h2>
            </article>
            <article class="catalog-card">
                <img src="img.png" alt="Бетонная техника SANY" class="catalog-card-image">
                <div class="catalog-card-overlay"></div>
                <h2 class="catalog-card-title">
                    Бетонная техника
                </h2>
            </article>

        </section>

    </main>
</body>
</html>
